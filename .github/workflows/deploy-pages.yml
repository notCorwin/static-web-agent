name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify and build site
        env:
          REQUIRE_BROWSER: "1"
        run: npm test

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published release
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          page_root="${PAGE_URL%/}/"
          for attempt in $(seq 1 12); do
            page_html="$(curl --fail --silent --show-error --location --max-time 20 "${page_root}?check=${EXPECTED_VERSION}" || true)"
            release_json="$(curl --fail --silent --show-error --location --max-time 20 "${page_root}version.json?check=${EXPECTED_VERSION}" || true)"
            if printf '%s' "${page_html}" | grep -Fq "name=\"build-version\" content=\"${EXPECTED_VERSION}\"" && printf '%s' "${release_json}" | grep -Fq "\"version\":\"${EXPECTED_VERSION}\""; then
              exit 0
            fi
            sleep 5
          done
          echo "Published Pages content did not expose ${EXPECTED_VERSION}."
          exit 1
